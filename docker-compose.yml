services: 
  localproxy:
    image: nginx:alpine
    container_name: local_proxy
    restart: always
    volumes:
      - ./conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - VIRTUAL_PORT=${VIRTUAL_PORT:-80}
    networks:
      - nginx-proxy
    extra_hosts:
      - "cam1.local:${CAMERA_1}"
      - "cam2.local:${CAMERA_2}"

networks:
  nginx-proxy:
    external: true
